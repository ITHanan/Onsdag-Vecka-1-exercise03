name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
      name:  Deploy with SERVICE_NAME
      runs-on: ubuntu-latest
      environment: development  

      steps:
      - name: Print environment
        shell: bash
        run: |
         echo "Deploying to ${{ github.environment }}"

      - name: Print service name
        shell: bash
        run: |
         echo "Deploying:${{ vars.SERVICE_NAME }}"

      - name: Print masked secret
        shell: bash
        run: |
         echo "API Key:${{ secrets.MY_API_KEY }}"
